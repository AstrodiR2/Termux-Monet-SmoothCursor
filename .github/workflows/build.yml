name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-monet-universal
          path: app/build/outputs/apk/debug/*_universal.apk
          if-no-files-found: error

      - name: Upload ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-monet-abi-apks
          path: |
            app/build/outputs/apk/debug/*_arm64-v8a.apk
            app/build/outputs/apk/debug/*_armeabi-v7a.apk
            app/build/outputs/apk/debug/*_x86_64.apk
            app/build/outputs/apk/debug/*_x86.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
